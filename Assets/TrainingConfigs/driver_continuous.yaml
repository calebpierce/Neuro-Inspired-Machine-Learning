default_settings:
  trainer_type: ppo
  hyperparameters:
    batch_size: 2048
    buffer_size: 20480
    learning_rate: 1.0e-4
    beta: 2.5e-4
    epsilon: 0.15
    lambd: 0.95
    num_epoch: 3
    learning_rate_schedule: constant
  network_settings:
    normalize: true
    hidden_units: 256
    num_layers: 3
  reward_signals:
    extrinsic:
      gamma: 0.995
      strength: 1.0
  max_steps: 2000000
  time_horizon: 512
  summary_freq: 25000

